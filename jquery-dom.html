<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native JavaScript and jQuery</title>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .myStyle {
            background-color: coral;
            padding: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>jQuery DOM Manipulation</h1>

    <h2>Operation A: Change Text</h2>
    <div id="myElement">Original Text</div>

    <h2>Operation B: Add CSS Class</h2>
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <h2>Operation C: Handle Button Click</h2>
    <button id="myButton">Click me</button>

    <script>
        $(document).ready(function () {

            $("#myElement").text("Modified Text");

            $("#myDIV").addClass("myStyle");

            $("#myButton").on("click", function () {
                alert("Button clicked!");
            });

        });
    </script>

</body>
</html>
